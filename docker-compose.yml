services:
  postgres:
    image: postgres:17
    env_file:
      - .env
    environment:
      POSTGRES_USER: "${PC_DB_USERNAME}"
      POSTGRES_PASSWORD: "${PC_DB_PASSWORD}"
      POSTGRES_DB: "${PC_DB_NAME}"
    ports: ["${PC_DB_OUT_PORT}:${PC_DB_PORT}"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PC_DB_USERNAME} -d ${PC_DB_NAME}"]
      interval: 1s
      timeout: 5s
      retries: 5
    volumes:
        - ./postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    command: ["sh", "-c", "env && uv run alembic upgrade head && uv run python3 -m src.main"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports: ["8000:8000"]
    # Монтируем код, чтобы горячий reload работал
    volumes:
      - ./src:/app/src
      - ./src/migrations:/app/migrations

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./minio_data:/data

  kafka:
    image: bitnami/kafka:latest
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER