name: procaloryai

services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: "${PC_DB_USERNAME:-lory}"
      POSTGRES_PASSWORD: "${PC_DB_PASSWORD:-lory}"
      POSTGRES_DB: "${PC_DB_NAME:-lory}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: .
    command: ["sh", "-c", "alembic upgrade head && python -m src.main"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PC_DB_USERNAME: "${PC_DB_USERNAME:-lory}"
      PC_DB_PASSWORD: "${PC_DB_PASSWORD:-lory}"
      PC_DB_HOST: postgres
      PC_DB_PORT: 5432
      PC_DB_NAME: "${PC_DB_NAME:-lory}"
      SECRET_JWT_KEY: "${SECRET_JWT_KEY:-local-study-secret-change-before-public-use}"
      PHOTOS_ENABLED: "${PHOTOS_ENABLED:-false}"
      TZ: UTC
    ports: ["${PC_API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Reserved for a future integration with the external AI Core.
  minio:
    profiles: ["photo"]
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - photo_data:/data

  kafka:
    profiles: ["photo"]
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER

volumes:
  db_data:
  photo_data:
